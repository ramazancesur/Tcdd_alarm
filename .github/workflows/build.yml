name: Test ve APK
on:
  push:
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TcddAlarm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK 34
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -n "$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0"
      - run: chmod +x gradlew
      - run: ./gradlew test assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TcddAlarm-debug-apk
          path: TcddAlarm/app/build/outputs/apk/debug/app-debug.apk
